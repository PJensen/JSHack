<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport"
		content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
	<title>JS-hack</title>
	<meta property="og:title" content="JS-Hack" />
	<meta property="og:description" content="A browser roguelike. Descend the dungeon. Die heroically. Share the shame." />
	<meta property="og:type" content="website" />
	<meta property="og:url" content="https://pjensen.github.io/JSHack/" />
	<meta name="twitter:card" content="summary" />
	<meta name="twitter:title" content="JS-Hack" />
	<meta name="twitter:description" content="A browser roguelike. Descend the dungeon. Die heroically. Share the shame." />
	<!-- Minimal inlined favicon to avoid 404 noise when serving locally -->
	<link rel="icon" type="image/svg+xml"
		href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='100%25'%20height='100%25'%20fill='%230b0d12'/%3E%3Ctext%20x='50%25'%20y='50%25'%20font-family='monospace'%20font-size='12'%20text-anchor='middle'%20dominant-baseline='central'%20fill='%23ffffff'%3E%40%3C/text%3E%3C/svg%3E">
	<style>
		html,
		body {
			height: 100%;
			width: 100%;
			margin: 0;
			background: #0b0e16;
			color: #9fb;
			overflow: hidden;
			/* hide scrollbars */
			overflow-x: hidden;
			overflow-y: hidden;
			scrollbar-width: none;
			/* firefox */
			-ms-overflow-style: none;
			/* IE/Edge */
			touch-action: none;
			/* disable browser gestures */
			overscroll-behavior: none;
			/* disable pull-to-refresh/back-forward swipe */
			user-select: none;
			-webkit-user-select: none;
			-ms-user-select: none;
			-webkit-touch-callout: none;
			-webkit-tap-highlight-color: transparent;
		}

		html::-webkit-scrollbar,
		body::-webkit-scrollbar {
			display: none;
		}

		body {
			display: grid;
			place-items: center;
		}

		canvas {
			width: 100vw;
			height: 100vh;
			display: block;
			image-rendering: pixelated;
			image-rendering: crisp-edges;
			touch-action: none;
			-ms-touch-action: none;
			-webkit-user-drag: none;
			user-select: none;
			outline: none;
			/* Prevent double-tap zoom */
			-webkit-touch-callout: none;
			-webkit-tap-highlight-color: transparent;
			/* Prevent context menu on long press */
			-webkit-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
		}

			.hint {
				position: fixed;
				bottom: 8px;
				right: 12px;
				font: 12px/1.2 system-ui, sans-serif;
				opacity: 0.6;
			}

			#boot-loader {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: grid;
				place-items: center;
				background: radial-gradient(circle at 50% 42%, #11182a 0%, #090c14 68%);
				opacity: 1;
				transition: opacity 180ms ease;
			}

			#boot-loader[data-hidden="1"] {
				opacity: 0;
				pointer-events: none;
			}

			#boot-card {
				width: min(84vw, 340px);
				padding: 14px 14px 12px;
				border: 1px solid rgba(178, 212, 255, 0.32);
				background: rgba(8, 12, 22, 0.86);
				box-shadow: 0 10px 35px rgba(0, 0, 0, 0.55);
				font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
				color: #d6ecff;
			}

			#boot-brand {
				margin: 2px 0 8px;
				font-size: 20px;
				letter-spacing: 0.08em;
				text-align: center;
				color: #8bd4ff;
				text-shadow: 0 0 8px rgba(139, 212, 255, 0.55);
				animation: bootBrandPulse 1.2s ease-in-out infinite;
			}

			#boot-brand .at {
				color: #cffff4;
				text-shadow: 0 0 10px rgba(170, 255, 220, 0.65);
			}

			#boot-label {
				letter-spacing: 0.03em;
				opacity: 0.95;
				margin-bottom: 8px;
			}

			#boot-track {
				height: 12px;
				border: 1px solid rgba(178, 212, 255, 0.35);
				background: rgba(10, 18, 32, 0.8);
				overflow: hidden;
			}

			#boot-fill {
				width: 0%;
				height: 100%;
				background: linear-gradient(90deg, #4ea8ff 0%, #86e9ff 100%);
				transition: width 90ms linear;
			}

			#boot-fraction {
				margin-top: 6px;
				color: #9fc6df;
				font-size: 11px;
				opacity: 0.9;
			}

			@keyframes bootBrandPulse {
				0%, 100% { opacity: 0.7; transform: translateY(0); }
				50% { opacity: 1; transform: translateY(-1px); }
			}
		</style>
	</head>

	<body>
		<canvas id="stage"></canvas>
		<div class="hint">JS-Hack</div>
		<div id="boot-loader">
			<div id="boot-card">
					<div id="boot-brand"><span class="at">@</span></div>
					<div id="boot-label">Loading...</div>
				<div id="boot-track"><div id="boot-fill"></div></div>
				<div id="boot-fraction">0%</div>
			</div>
		</div>
		<!-- Entry module: must be a native ES module and use relative imports with extensions. -->
		<script>
			const bootLoader = document.getElementById('boot-loader');
			const bootLabel = document.getElementById('boot-label');
			const bootFill = document.getElementById('boot-fill');
			const bootFraction = document.getElementById('boot-fraction');
			const saveKey = 'jshack:savegame:v1';
			let bootDone = 0;
			let bootTotal = 1;
			let bootHidden = false;
			let bootDoneRequested = false;
			let bootQueueRunning = false;
			const bootQueue = [];

			function clamp01(v) { return Math.max(0, Math.min(1, v)); }
			function hasValidFloorOverride() {
				try {
					const params = new URLSearchParams(window.location.search || '');
					const raw = params.get('floor');
					if (raw == null) return false;
					const value = Number.parseInt(String(raw), 10);
					return Number.isFinite(value) && value >= 0;
				} catch { return false; }
			}
			function hasSavegame() {
				try { return !!localStorage.getItem(saveKey); } catch { return false; }
			}
			function renderBoot() {
				const pct = clamp01(bootDone / Math.max(1, bootTotal));
				bootFill.style.width = `${(pct * 100).toFixed(2)}%`;
				bootFraction.textContent = `${Math.round(pct * 100)}% (${Math.max(0, Math.floor(bootDone))}/${Math.max(1, Math.floor(bootTotal))})`;
			}

			function applyBootProgress(progress = {}) {
				const nextDone = Number(progress.done);
				const nextTotal = Number(progress.total);
				if (Number.isFinite(nextDone)) bootDone = Math.max(0, nextDone);
				if (Number.isFinite(nextTotal)) bootTotal = Math.max(1, nextTotal);
				if (typeof progress.label === 'string' && progress.label.length) bootLabel.textContent = progress.label;
				renderBoot();
			}

			function bootStepDelayMs() {
				const rnd = 1 + Math.floor(Math.random() * 10); // 50..100
				return 1 + rnd; // 100..150
			}

			function flushBootQueue() {
				if (bootQueueRunning) return;
				bootQueueRunning = true;
				const run = () => {
					const next = bootQueue.shift();
					if (!next) {
						bootQueueRunning = false;
						if (bootDoneRequested) hideBootLoader();
						return;
					}
					applyBootProgress(next);
					setTimeout(run, bootStepDelayMs());
				};
				run();
			}

			function hideBootLoader() {
				if (bootHidden) return;
				bootHidden = true;
				bootDone = bootTotal;
				renderBoot();
				bootLoader.setAttribute('data-hidden', '1');
				setTimeout(() => bootLoader.remove(), 240);
			}

			window.__JSHACK_BOOT_PROGRESS = (progress = {}) => {
				bootQueue.push(progress);
				flushBootQueue();
			};

			window.__JSHACK_BOOT_DONE = () => {
				bootDoneRequested = true;
				if (!bootQueueRunning && bootQueue.length === 0) hideBootLoader();
			};

			if (hasSavegame() && !hasValidFloorOverride()) bootLabel.textContent = 'Loading from Save';
			renderBoot();

			const hash = new Date().getTime().toString(16);
			// Register a dev service worker to bust module cache on mobile
			if ('serviceWorker' in navigator) {
			try { navigator.serviceWorker.register(`./sw.js?v=${hash}`); } catch {}
		}
		const script = document.createElement('script');
		script.type = 'module';
		script.src = `./src/main.js?v=${hash}`;
		document.body.appendChild(script);
	</script>
</body>

</html>
