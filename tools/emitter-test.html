<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Emitter Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #ddd; font-family: monospace; font-size: 13px; display: flex; height: 100vh; overflow: hidden; }

  #canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #0a0a0a; }
  canvas { border: 1px solid #333; }

  #sidebar { width: 280px; min-width: 280px; background: #1a1a1a; border-left: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; }

  #controls { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }

  .section-label { color: #888; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; padding-bottom: 2px; border-bottom: 1px solid #2a2a2a; }

  .row { display: flex; align-items: center; gap: 6px; }
  .row label { width: 90px; min-width: 90px; color: #aaa; }
  .row input[type=range] { flex: 1; accent-color: #66ccff; }
  .row .val { width: 50px; min-width: 50px; text-align: right; color: #eee; }
  .row input[type=color] { width: 36px; height: 22px; border: none; background: none; cursor: pointer; padding: 0; }
  .row input[type=checkbox] { width: 16px; height: 16px; accent-color: #66ccff; cursor: pointer; }

  #export-section { padding: 10px; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 8px; }
  #export-btn, #burst-btn {
    padding: 7px 10px; border: none; border-radius: 3px; cursor: pointer; font-family: monospace; font-size: 13px;
  }
  #export-btn { background: #264d66; color: #9de; }
  #export-btn:hover { background: #335f7a; }
  #burst-btn { background: #3a2a10; color: #fca; }
  #burst-btn:hover { background: #4a3818; }

  #output {
    background: #0d1117; border: 1px solid #2a2a2a; border-radius: 3px;
    padding: 8px; font-size: 11px; color: #9de; white-space: pre;
    max-height: 220px; overflow-y: auto; display: none;
  }

  #stats { font-size: 10px; color: #555; padding: 4px 10px; border-top: 1px solid #222; }
</style>
</head>
<body>

<div id="canvas-wrap">
  <canvas id="c" width="760" height="560"></canvas>
</div>

<div id="sidebar">
  <div id="controls">

    <div class="section-label">Emitter</div>

    <div class="row">
      <label>continuous</label>
      <input type="checkbox" id="continuous" checked>
    </div>

    <div class="row">
      <label>rate</label>
      <input type="range" id="rate" min="0" max="100" step="1" value="16">
      <span class="val" id="rate-v">16</span>
    </div>

    <div class="section-label">Direction</div>

    <div class="row">
      <label>angle</label>
      <input type="range" id="angle" min="-3.1416" max="3.1416" step="0.01" value="-1.5708">
      <span class="val" id="angle-v">-1.57</span>
    </div>

    <div class="row">
      <label>spread</label>
      <input type="range" id="spread" min="0" max="3.1416" step="0.01" value="1.0472">
      <span class="val" id="spread-v">1.05</span>
    </div>

    <div class="section-label">Speed</div>

    <div class="row">
      <label>speed</label>
      <input type="range" id="speed" min="0" max="10" step="0.05" value="1.4">
      <span class="val" id="speed-v">1.4</span>
    </div>

    <div class="row">
      <label>speedJitter</label>
      <input type="range" id="speedJitter" min="0" max="1" step="0.01" value="0.5">
      <span class="val" id="speedJitter-v">0.5</span>
    </div>

    <div class="section-label">Acceleration</div>

    <div class="row">
      <label>ax</label>
      <input type="range" id="ax" min="-10" max="10" step="0.05" value="0">
      <span class="val" id="ax-v">0</span>
    </div>

    <div class="row">
      <label>ay</label>
      <input type="range" id="ay" min="-10" max="10" step="0.05" value="2.5">
      <span class="val" id="ay-v">2.5</span>
    </div>

    <div class="section-label">Life</div>

    <div class="row">
      <label>life</label>
      <input type="range" id="life" min="0.05" max="5" step="0.05" value="0.7">
      <span class="val" id="life-v">0.7</span>
    </div>

    <div class="row">
      <label>lifeJitter</label>
      <input type="range" id="lifeJitter" min="0" max="1" step="0.01" value="0.3">
      <span class="val" id="lifeJitter-v">0.3</span>
    </div>

    <div class="section-label">Size</div>

    <div class="row">
      <label>size</label>
      <input type="range" id="size" min="0.01" max="3" step="0.01" value="0.35">
      <span class="val" id="size-v">0.35</span>
    </div>

    <div class="row">
      <label>sizeEnd</label>
      <input type="range" id="sizeEnd" min="0" max="3" step="0.01" value="0.08">
      <span class="val" id="sizeEnd-v">0.08</span>
    </div>

    <div class="section-label">Color &amp; Alpha</div>

    <div class="row">
      <label>color</label>
      <input type="color" id="color" value="#66ccff">
      <span class="val" id="color-v">#66ccff</span>
    </div>

    <div class="row">
      <label>alpha0</label>
      <input type="range" id="alpha0" min="0" max="1" step="0.01" value="0.7">
      <span class="val" id="alpha0-v">0.7</span>
    </div>

    <div class="row">
      <label>alpha1</label>
      <input type="range" id="alpha1" min="0" max="1" step="0.01" value="0">
      <span class="val" id="alpha1-v">0</span>
    </div>

    <div class="section-label">Offset</div>

    <div class="row">
      <label>offsetX</label>
      <input type="range" id="offsetX" min="-5" max="5" step="0.05" value="0">
      <span class="val" id="offsetX-v">0</span>
    </div>

    <div class="row">
      <label>offsetY</label>
      <input type="range" id="offsetY" min="-5" max="5" step="0.05" value="-0.3">
      <span class="val" id="offsetY-v">-0.3</span>
    </div>

    <div class="section-label">Render</div>

    <div class="row">
      <label>scale (px/u)</label>
      <input type="range" id="scale" min="8" max="128" step="1" value="48">
      <span class="val" id="scale-v">48</span>
    </div>

  </div><!-- /controls -->

  <div id="export-section">
    <button id="burst-btn">Burst</button>
    <button id="export-btn">Export Config</button>
    <pre id="output"></pre>
  </div>

  <div id="stats">particles: 0 &nbsp;|&nbsp; emitters: 1</div>
</div>

<script type="module">
import { ParticlePool, ParticleEmitter } from '../src/display/passes/vfx/particles/particlePool.js';

// ─── Setup ────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const pool   = new ParticlePool(8192);

let pxPerUnit = 48;
let emitter;

function worldToScreen({ x, y, size }) {
  return {
    x: canvas.width  * 0.5 + x * pxPerUnit,
    y: canvas.height * 0.5 + y * pxPerUnit,
    size: size * pxPerUnit,
  };
}

// ─── Config reading ───────────────────────────────────────────────────────
function num(id) { return parseFloat(document.getElementById(id).value); }

function readConfig() {
  return {
    continuous:  document.getElementById('continuous').checked,
    rate:        num('rate'),
    angle:       num('angle'),
    spread:      num('spread'),
    speed:       num('speed'),
    speedJitter: num('speedJitter'),
    ax:          num('ax'),
    ay:          num('ay'),
    life:        num('life'),
    lifeJitter:  num('lifeJitter'),
    size:        num('size'),
    sizeEnd:     num('sizeEnd'),
    color:       document.getElementById('color').value,
    alpha0:      num('alpha0'),
    alpha1:      num('alpha1'),
    offsetX:     num('offsetX'),
    offsetY:     num('offsetY'),
  };
}

// Recreate emitter from current UI — existing particles in pool keep living
function rebuildEmitter() {
  pxPerUnit = num('scale');
  document.getElementById('scale-v').textContent = pxPerUnit;
  emitter = new ParticleEmitter(readConfig());
}

// ─── Slider wiring ────────────────────────────────────────────────────────
const sliders = [
  'rate','angle','spread','speed','speedJitter',
  'ax','ay','life','lifeJitter','size','sizeEnd',
  'alpha0','alpha1','offsetX','offsetY',
];

sliders.forEach(id => {
  const el    = document.getElementById(id);
  const valEl = document.getElementById(id + '-v');
  el.addEventListener('input', () => {
    valEl.textContent = parseFloat(el.value).toFixed(id === 'rate' ? 0 : 2);
    rebuildEmitter();
  });
});

document.getElementById('continuous').addEventListener('change', rebuildEmitter);

document.getElementById('color').addEventListener('input', () => {
  document.getElementById('color-v').textContent = document.getElementById('color').value;
  rebuildEmitter();
});

document.getElementById('scale').addEventListener('input', rebuildEmitter);

// ─── Export ───────────────────────────────────────────────────────────────
function fmt(v) { return parseFloat(v.toPrecision(4)).toString(); }

document.getElementById('export-btn').addEventListener('click', () => {
  const c = readConfig();
  const out = `{
  continuous: ${c.continuous},
  rate: ${fmt(c.rate)}, angle: ${fmt(c.angle)}, spread: ${fmt(c.spread)},
  speed: ${fmt(c.speed)}, speedJitter: ${fmt(c.speedJitter)}, ax: ${fmt(c.ax)}, ay: ${fmt(c.ay)},
  life: ${fmt(c.life)}, lifeJitter: ${fmt(c.lifeJitter)}, size: ${fmt(c.size)}, sizeEnd: ${fmt(c.sizeEnd)},
  color: '${c.color}', alpha0: ${fmt(c.alpha0)}, alpha1: ${fmt(c.alpha1)},
  offsetX: ${fmt(c.offsetX)}, offsetY: ${fmt(c.offsetY)},
};`;
  const el = document.getElementById('output');
  el.textContent = out;
  el.style.display = 'block';
});

// ─── Burst ────────────────────────────────────────────────────────────────
// Fire a one-shot burst using the real emitter API: continuous=false + burstCount
document.getElementById('burst-btn').addEventListener('click', () => {
  const cfg = readConfig();
  const burstCount = Math.max(4, Math.round(cfg.rate * cfg.life));
  const burst = new ParticleEmitter({ ...cfg, continuous: false, burstCount });
  burst.step(pool, 0, 0, 0); // triggers _burst on first step
});

// ─── Loop ─────────────────────────────────────────────────────────────────
rebuildEmitter(); // initial build

let last = null;
function frame(ts) {
  const dt = last ? Math.min((ts - last) / 1000, 0.05) : 0.016;
  last = ts;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Crosshair
  const cx = canvas.width * 0.5, cy = canvas.height * 0.5;
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx - 10, cy); ctx.lineTo(cx + 10, cy);
  ctx.moveTo(cx, cy - 10); ctx.lineTo(cx, cy + 10);
  ctx.stroke();

  emitter.step(pool, dt, 0, 0);
  pool.step(dt);
  pool.render(ctx, worldToScreen, { mode: 'lighter', alphaScale: 1 });

  document.getElementById('stats').textContent =
    `particles: ${pool.count}  |  pool cap: ${pool.cap}`;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
